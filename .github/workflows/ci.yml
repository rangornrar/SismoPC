name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore SismoPC.slnx

      - name: Compilation
        run: dotnet build SismoPC.slnx --configuration Release --no-restore

      - name: Tests
        run: dotnet test SismoPC.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      - name: Publication du service (x64, autonome)
        run: dotnet publish src/SismoPC.Service/SismoPC.Service.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/service

      - name: Publication du Notifier (x64, autonome)
        run: dotnet publish src/SismoPC.Notifier/SismoPC.Notifier.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/notifier

      - name: Publication de l'interface (x64, autonome)
        run: dotnet publish src/SismoPC.App/SismoPC.App.csproj --configuration Release --runtime win-x64 --self-contained true --output publish/app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests
          path: TestResults

      - uses: actions/upload-artifact@v4
        with:
          name: sismopc-win-x64
          path: publish
