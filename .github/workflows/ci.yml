name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restauration
        run: dotnet restore SismoPC.slnx

      - name: Compilation
        run: dotnet build SismoPC.slnx --configuration Release --no-restore

      - name: Tests
        run: dotnet test SismoPC.slnx --configuration Release --no-build --logger "trx;LogFileName=results.trx" --results-directory TestResults

      # Installeur de développement (version 0.0.0) : téléchargeable dans les artefacts de chaque exécution.
      - name: Installeur
        shell: pwsh
        run: ./build/package.ps1 -Version 0.0.${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: resultats-tests
          path: TestResults

      - uses: actions/upload-artifact@v4
        with:
          name: installeur-dev
          path: artifacts
