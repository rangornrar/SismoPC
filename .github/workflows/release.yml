name: Release

# Une version publiée = un tag « vX.Y.Z » poussé sur GitHub,
# ou un envoi sur la branche « release » : la version est alors lue dans Directory.Build.props
# et le tag vX.Y.Z est créé par la release.
on:
  push:
    tags: ['v*']
    branches: [release]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Version
        id: version
        shell: pwsh
        run: |
          if ('${{ github.ref_type }}' -eq 'tag') {
            $v = '${{ github.ref_name }}'.TrimStart('v')
          } else {
            $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          }
          "version=$v" >> $env:GITHUB_OUTPUT
          "tag=v$v" >> $env:GITHUB_OUTPUT

      - name: Tests
        run: dotnet test SismoPC.slnx --configuration Release

      - name: Installeur
        shell: pwsh
        run: ./build/package.ps1 -Version ${{ steps.version.outputs.version }}

      - name: Release GitHub
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = '${{ steps.version.outputs.version }}'
          $notes = @"
          ## Installation

          1. Télécharge **SismoPC-$v-setup-x64.exe** ci-dessous et lance-le (droits administrateur demandés : le service de collecte en a besoin).
          2. Windows SmartScreen peut afficher « Windows a protégé votre ordinateur » : l'installeur n'est pas encore signé. Clique sur **Informations complémentaires**, puis **Exécuter quand même**.
          3. Pour les températures, installe aussi le pilote [PawnIO](https://github.com/namazso/PawnIO.Setup/releases) (case proposée par l'installeur).

          SismoPC apprend la normale de ton PC pendant 14 jours avant de signaler des anomalies. Les ralentissements et les alertes matérielles sont actifs tout de suite.

          Empreinte SHA-256 : voir SHA256SUMS.txt.
          "@
          $extra = @()
          if ($v.StartsWith('0.')) { $extra += '--prerelease' }
          $files = @(Get-ChildItem artifacts -Filter *.exe | ForEach-Object FullName) + 'artifacts/SHA256SUMS.txt'
          gh release create '${{ steps.version.outputs.tag }}' @files --target '${{ github.sha }}' --title "SismoPC $v" --notes $notes @extra
          if ($LASTEXITCODE -ne 0) { throw 'Échec de la création de la release' }
